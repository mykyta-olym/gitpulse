services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gitpulse
      POSTGRES_PASSWORD: gitpulse
      POSTGRES_DB: gitpulse
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitpulse"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Local mail catcher: the app's .env points SMTP at 127.0.0.1:1025; every
  # outgoing email lands in the Mailpit UI at http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata_dev:
