# Nginx configuration for GitPulse Documentation
# Serves static MkDocs site with caching

# What each page tells a crawler.
#
# This list used to hold `api|bezpecnost|changelog|diplomovka|gitlab|operatori|
# tags|vyvojari`, which took the API reference, the changelog, the thesis and
# the developer guide - four PUBLIC sections, the ones worth finding - out of
# Google, while the four sections that genuinely cannot be crawled were left in
# the sitemap answering 302 to a login page. Measured 2026-09-08: of the 49 URLs
# submitted, 20 redirected and several of the remaining 29 were served with
# `noindex` at the same time, which Search Console reports as "Submitted URL
# marked noindex".
#
# There is exactly one rule now, and it follows the access rule rather than a
# guess about which content is "technical":
#
#   * a page behind a session (see api/docs_authz.py: ADMIN_ONLY + STAFF_ONLY)
#     is unreachable for a crawler, so it is Disallowed in the site's robots.txt
#     and is not in the sitemap. It is deliberately NOT noindex-ed here:
#     noindex on a Disallowed URL is a contradiction Google cannot read.
#   * `tags/` and `search/` are generated index pages with no prose of their
#     own - noindex, follow: crawl through them, do not list them.
#   * everything else is public documentation and says so explicitly, with the
#     preview limits docs.gitlab.com uses.
#
# tests/unit/test_the_docs_agree_on_what_google_may_see.py pins this against
# docs_authz.py so the two cannot drift apart again.
map $uri $robots_tag {
    default "index, follow, max-image-preview:large, max-snippet:-1";
    ~*^/(en/)?(tags|search)(/|$) "noindex, follow";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Root directory
    root /usr/share/nginx/html;
    index index.html;

    # Note: Gzip compression is turned off here because the Caddy reverse-proxy
    # in front of Nginx handles `encode zstd gzip` dynamically and efficiently.
    # Compressing twice wastes CPU.

    # Security & SEO headers are largely handled by Caddy (X-Frame-Options, etc.).
    # We only inject X-Robots-Tag dynamically via the map, but because Nginx 
    # add_header directive does not inherit if defined in a location block, 
    # we explicitly place it in the location blocks below.

    # Cache fonts (immutable)
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    # Cache other static assets (allow revalidation)
    # Revalidate, do NOT cache for a week.
    #
    # Hugo and Vite emit stable filenames here - main.css, main.js,
    # gitpulse-logo-header.svg - with no content hash, because docs.gitlab.com
    # serves each release from its own versioned path and never needs one.
    # `expires 7d` therefore pinned readers to whatever they downloaded first:
    # after the header logo changed, browsers kept serving the old stylesheet,
    # which still pointed at GitLab's logo, and the site looked unchanged for a
    # week no matter what was deployed.
    #
    # `expires -1` sends no-cache, so every request revalidates against the
    # ETag nginx already emits. A page that has not changed still costs one 304
    # and no body.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires -1;
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    # HTML: no-store prevents browser & proxy caching entirely
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag $robots_tag always;
    }

    # Disable caching for root / (index.html via try_files)
    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files /index.html =404;
    }

    # Health check endpoint
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # Metrics endpoint (optional)
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    # Main location - serve static files
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag $robots_tag always;
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Handle 404 with custom page
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Robots-Tag "noindex, nofollow, nosnippet" always;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Logging
    access_log /var/log/nginx/docs_access.log;
    error_log /var/log/nginx/docs_error.log warn;
}
