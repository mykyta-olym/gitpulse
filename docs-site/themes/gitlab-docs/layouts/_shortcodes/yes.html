{{- $ariaLabel := T "yesNo.yes" -}}
{{- $name := "check-sm" -}}
{{- $iconsSVG := "gitlab_ui/svgs-latest/icons.svg" | relURL -}}

<!-- The safeHTML function tells Hugo that the content is safe to render as HTML. This helps to prevent unexpected escaping, extra <span> tags etc. -->
{{- safeHTML (printf `<span> <svg role="img" aria-label="%s" class="gl-icon s16"><use href="%s#%s"/><title>%s</title></svg> </span>` $ariaLabel $iconsSVG $name $name) -}}
