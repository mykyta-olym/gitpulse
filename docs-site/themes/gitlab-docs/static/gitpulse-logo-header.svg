<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 196 32" width="196" height="32" role="img" aria-label="GitPulse Docs">
  <g transform="scale(0.667)">
<defs>
    <!-- Shading Gradients -->
    <linearGradient id="gpGradCenterHdr" x1="18" y1="19" x2="31" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ff7a00"/>
      <stop offset="100%" stop-color="#e24329"/>
    </linearGradient>
    <linearGradient id="gpGradLeftEarHdr" x1="11" y1="6" x2="18" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fc6d26"/>
      <stop offset="100%" stop-color="#e24329"/>
    </linearGradient>
    <linearGradient id="gpGradRightEarHdr" x1="37" y1="6" x2="31" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fc6d26"/>
      <stop offset="100%" stop-color="#e24329"/>
    </linearGradient>
    <linearGradient id="gpGradLeftCheekHdr" x1="6" y1="27" x2="24" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fca326"/>
      <stop offset="100%" stop-color="#fc6d26"/>
    </linearGradient>
    <linearGradient id="gpGradRightCheekHdr" x1="42" y1="27" x2="24" y2="42" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fca326"/>
      <stop offset="100%" stop-color="#fc6d26"/>
    </linearGradient>
  </defs>

  <!-- GitLab Tanuki -->
  <g class="gp-logo-body" opacity="0.85">
    <path class="gp-part gp-left-cheek" d="M6 27.4152L17.9932 18.9935L23.9627 42Z" fill="url(#gpGradLeftCheekHdr)" />
    <path class="gp-part gp-right-cheek" d="M42 27.4152L30.9661 18.9935L23.9627 42Z" fill="url(#gpGradRightCheekHdr)" />
    <path class="gp-part gp-left-ear" d="M11.0151 6L17.9932 18.9935L6 27.4152Z" fill="url(#gpGradLeftEarHdr)" />
    <path class="gp-part gp-right-ear" d="M36.9957 6L30.9661 18.9935L42 27.4152Z" fill="url(#gpGradRightEarHdr)" />
    <path class="gp-part gp-center" d="M17.9932 18.9935H30.9661L23.9627 42Z" fill="url(#gpGradCenterHdr)" />
  </g>

  <!-- ECG Glowing Pulse Line -->
  <!-- Background Cyan Glow -->
  <path class="gp-ecg-halo" pathLength="100" d="M2 24H16L18 27L21.5 10L24.5 38L27.5 21L30 24H46" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" />
  <!-- Theme Contrast Guard -->
  <path class="gp-ecg-guard" pathLength="100" d="M2 24H16L18 27L21.5 10L24.5 38L27.5 21L30 24H46" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.4" />
  <!-- Resting Core Line -->
  <path class="gp-ecg-core" pathLength="100" d="M2 24H16L18 27L21.5 10L24.5 38L27.5 21L30 24H46" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.2" />
  <!-- White Moving Pulse Segment -->
  <path class="gp-ecg-trace-pulse" pathLength="100" d="M2 24H16L18 27L21.5 10L24.5 38L27.5 21L30 24H46" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" />
  </g>
  <text x="38" y="24" font-family="GitLab Sans, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="24" font-weight="600" fill="#18171d">GitPulse <tspan font-weight="400">Docs</tspan></text>
</svg>
