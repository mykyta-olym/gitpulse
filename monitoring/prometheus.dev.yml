global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "gitpulse-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: "gitpulse"
          component: "api"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: "monitoring"
          component: "prometheus"

  - job_name: "grafana"
    metrics_path: /grafana/metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: "monitoring"
          component: "grafana"

  - job_name: "jaeger"
    scrape_interval: 30s
    static_configs:
      - targets: ["jaeger:14269"]
        labels:
          service: "monitoring"
          component: "jaeger"

