<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <title>Offline - GitPulse</title>
  <!-- App favicon so the offline tab shows the current GitPulse logo, not the
       browser's default globe. -->
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/static/img/icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/static/img/icons/apple-touch-icon.png">
  <script nonce="{{ csp_nonce }}" src="/static/js/theme-bootstrap.js"></script>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/theme.css">
  <link rel="stylesheet" href="/static/css/error.css">
</head>
<body>
  <main class="error-page">
    <a class="error-brand" href="/dashboard/" aria-label="GitPulse">
      <img src="/static/favicon.svg" alt="" width="34" height="34" decoding="async">
      <span class="error-brand-name">GitPulse</span>
    </a>
    <h1>You're offline</h1>
    <p>GitPulse can't reach the network right now. Check your connection and try again.</p>
    <form class="error-actions" method="get">
      <button class="error-btn" type="submit">Retry</button>
    </form>
  </main>
</body>
</html>
